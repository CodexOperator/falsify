# DRAFT, private: never a PR, never a push, until the owner's yes. repo, sha and maintainer are placeholders.
name: falsify
repo: https://github.com/OWNER/falsify
sha: "0000000000000000000000000000000000000000"  # PLACEHOLDER: the pinned commit at submission
description: >-
  A claim is not done until it survives a check that could have failed. The agent pre-registers each
  claim (its check and a MUTANT that must fail), hashed before any run; judging runs the mutant and then
  the check, and a mutant that passes reads VOID (the check was vacuous). A pre_verify nudge names every
  claim not done on a proved result before the turn finishes; it never blocks completion. Disclosure —
  falsify RUNS the check and mutant commands the agent registered, with your permissions and no sandbox;
  for a patched mutant it copies the check's working directory to a temp dir, edits one string there and
  runs the mutant in the copy (the original tree is read, never written); every run
  first asks a human through Hermes's approval gate with the exact argv, and under cron, gateway
  auto-approve or any run where no human answered it records VOID 'not run' and executes nothing. Stores
  records and results under its own plugin data dir; no network, no credentials, no background process.
maintainer: OWNER
tier: community
category: tools
requires_hermes: ">=0.23.0"
docs_url: https://github.com/OWNER/falsify#readme
version: "0.1.0"
platforms: []
capabilities:
  provides_tools:
    - falsify_register
    - falsify_judge
    - falsify_done
    - falsify_status
  provides_hooks:
    - pre_verify
    - pre_tool_call
    - post_approval_response
  provides_middleware: []
  requires_env: []
