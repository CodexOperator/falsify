name: falsify
version: 0.1.0
requires_hermes: ">=0.23.0"
description: "A claim is not done until it survives a pre-registered check AND a mutant that must fail (VOID if the mutant passes). Nudges before finish via pre_verify; never blocks completion; every check and mutant runs only after a human approves its exact argv."
author: "falsify (private, pre-release)"
provides_hooks:
  - pre_verify
  - pre_tool_call
  - post_approval_response
provides_tools:
  - falsify_register
  - falsify_judge
  - falsify_done
  - falsify_status
python_dependencies: []
