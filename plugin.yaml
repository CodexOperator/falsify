name: falsify
version: 0.1.0
requires_hermes: ">=0.23.0"
description: "A claim is not done until its pre-registered check passes on the agent's change AND fails with that change reverted (VOID if it passes without it). Nudges before finish via pre_verify; never blocks completion; every check runs only after a human approves its exact argv."
author: "falsify contributors"
provides_hooks:
  - pre_verify
  - pre_tool_call
  - post_approval_response
provides_tools:
  - falsify_register
  - falsify_judge
  - falsify_done
  - falsify_status
python_dependencies: []
config_schema:
  draft_url: {type: secret, env: FALSIFY_DRAFT_URL, label: "Blind drafter URL", description: "OPTIONAL. An OpenAI-compatible base (e.g. a local llama.cpp server) or, with draft_api anthropic, a Messages API base. Unset = no blind mutants; falsify makes no network call. A secret because a URL can carry credentials."}
  draft_key: {type: secret, env: FALSIFY_DRAFT_KEY, label: "Blind drafter key", description: "OPTIONAL. Sent only to the drafter URL; read through Hermes's secret scope, never written."}
  draft_api: {type: str, choices: [openai, anthropic], default: openai, label: "Drafter API"}
  draft_model: {type: str, default: local, label: "Drafter model"}
  draft_view: {type: str, choices: [files, claim], default: files, label: "Drafter view", description: "files = the claim + the base files minus every file the check names or would discover; claim = the claim's words only"}
  draft_k: {type: int, default: 5, label: "Blind mutants per claim (K)"}
